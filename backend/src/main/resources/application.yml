spring:
  application:
    name: gym

  datasource:
    # 로컬 실행: localhost, 컨테이너 실행: DB_HOST=db 로 주입 (CLAUDE.md §13.4)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:gym}
    username: ${POSTGRES_USER:gym_user}
    # 비밀번호는 파일에 하드코딩하지 않는다 — .env 등 환경변수로 주입 (CLAUDE.md §12)
    password: ${POSTGRES_PASSWORD}

  # 스키마는 Flyway 마이그레이션(db/migration/V*.sql)이 유일한 원천이다.
  # 이미 테이블이 있는 기존 DB는 baseline(V1 건너뜀), 빈 DB는 V1 부터 순서대로 적용된다.
  flyway:
    baseline-on-migrate: true

  jpa:
    hibernate:
      # Hibernate 는 스키마를 만들지 않고 엔티티와 DB 의 일치 여부만 검증한다
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT 설정. 비밀키는 파일에 두지 않고 환경변수(.env)로 주입한다 (CLAUDE.md §12)
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}

# 첫 관리자 계정 시딩 값. 실제 비밀번호는 .env 로 주입한다 (CLAUDE.md §12)
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
